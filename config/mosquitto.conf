listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type notice
connection_messages true

# The truth file is deliberately never published. If a truth topic is added
# later, this ACL demonstrates how the twin can be prevented from reading it.
# topic readwrite dt/battery/pack01/#
# topic readwrite dt/battery/pack01/truth
